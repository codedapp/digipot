<!doctype html>
<html lang="hr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIGIPOT</title><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#009b8d">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DIGIPOT">
<style>
html,body{margin:0;height:100%;font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#33424a;background:#fdfdfd}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#009b8d 0%,#0b6f68 100%)}
form{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 18px 48px rgba(0,0,0,.28)}
.brand{font-weight:900;letter-spacing:.18em;font-size:22px;color:#009b8d}.brand span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#009b8d;margin-left:6px;vertical-align:middle}
.tag{font-size:12.5px;color:#5f6366;margin:2px 0 18px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd6d9;border-radius:10px;font-size:17px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:#5f6366;margin-top:12px}
button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:#009b8d;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button[disabled]{opacity:.6}#err{color:#b42318;font-size:13px;min-height:18px;margin-top:8px}
.foot{font-size:11.5px;color:#8a9296;margin-top:14px}
</style></head><body>
<div id="gate"><form onsubmit="gateEnter(event)">
<div class="brand">DIGIPOT<span></span></div><div class="tag">Od agenta za agente. · Probna verzija</div>
<label for="pw">Pristupni kod</label>
<input id="pw" type="password" autocomplete="current-password" autocapitalize="none" required placeholder="Unesite kod">
<div class="row"><input id="rem" type="checkbox" checked><label for="rem" style="margin:0;font-weight:500">Zapamti na ovom uređaju</label></div>
<div id="err"></div><button id="btn" type="submit">Otvori DIGIPOT</button>
<div class="foot">Aplikacija radi lokalno na uređaju. Bez ispravnog koda sadržaj je šifriran i nečitljiv.</div>
</form></div>
<script>
const IT=250000,KEY_K="digipot_gate_key";
async function derive(code,salt){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"]);
 return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:IT,hash:"SHA-256"},km,256))}
let binP=null;const bin=()=>binP||(binP=fetch("app.bin",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("app.bin "+r.status);return r.arrayBuffer()}).then(b=>new Uint8Array(b)));
async function unlock(raw){const d=await bin(),iv=d.slice(16,28),ct=d.slice(28);
 const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},k,ct);const html=new TextDecoder().decode(pt);
 document.open();document.write(html);document.close()}
async function gateEnter(ev){ev.preventDefault();const b=document.getElementById("btn"),err=document.getElementById("err");b.disabled=true;err.textContent="";
 try{const d=await bin(),raw=await derive(document.getElementById("pw").value.trim(),d.slice(0,16));
  if(document.getElementById("rem").checked){try{localStorage.setItem(KEY_K,btoa(String.fromCharCode(...raw)))}catch(e){}}
  await unlock(raw)}
 catch(e){err.textContent=String(e).includes("app.bin")?"Aplikacija trenutno nije dostupna.":"Neispravan pristupni kod.";document.getElementById("pw").select();b.disabled=false}}
(async()=>{try{const s=localStorage.getItem(KEY_K);if(s){await unlock(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));return}}catch(e){try{localStorage.removeItem(KEY_K)}catch(_){}}
 setTimeout(()=>document.getElementById("pw").focus(),60)})();
if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
</script></body></html>
